# Minimal install — no git clone required.
# Recommended: curl -fsSL https://raw.githubusercontent.com/recallsync/email-verifier/main/install.sh | bash
# Manual:
# 1. mkdir email-verifier && cd email-verifier
# 2. copy docker-compose.yml, docker-compose.ngrok.yml, .env.example, README.md, INSTRUCTIONS.md
# 3. cp .env.example .env  (set POSTGRES_PASSWORD)
# 4. docker compose pull && docker compose up -d
# 5. open http://localhost:5050 — see INSTRUCTIONS.md for daily use

services:
  app:
    image: envisiontechai/fusionsyncai-email-verifier:latest
    container_name: email-verifier
    ports:
      - "${APP_PORT:-5050}:5050"
    environment:
      PYTHONUNBUFFERED: "1"
      DATABASE_URL: postgresql://verifier:${POSTGRES_PASSWORD:-changeme}@postgres:5432/email_verifier
      DATA_DIR: /app/data
      CHUNK_TICK_INTERVAL: ${CHUNK_TICK_INTERVAL:-15}
    volumes:
      - ./data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5050/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  postgres:
    image: envisiontechai/fusionsyncai-email-verifier:postgres-16
    container_name: email-verifier-db
    environment:
      POSTGRES_DB: email_verifier
      POSTGRES_USER: verifier
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_cron
      - -c
      - cron.database_name=email_verifier
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U verifier -d email_verifier"]
      interval: 10s
      timeout: 5s
      retries: 5
